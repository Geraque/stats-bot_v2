server:
  port: 8098
spring:
  config:
    import: "optional:classpath:application-secrets.yaml"
  datasource:
    url: jdbc:postgresql://localhost:5434/stats_bot
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

bot:
  name: Doceho

telegram:
  enabled: false
  bot:
    name: ${bot.name:Doceho}
    token: ${bot.token:}
  timeout:
    connect-ms: ${TELEGRAM_CONNECT_TIMEOUT_MS:2000}
    read-ms: ${TELEGRAM_READ_TIMEOUT_MS:5000}
    request-ms: ${TELEGRAM_REQUEST_TIMEOUT_MS:2000}
    get-updates-seconds: ${TELEGRAM_GET_UPDATES_TIMEOUT_SECONDS:30}

leetify: {}
